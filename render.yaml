services:
  # TravelRescue Backend + Frontend Web Service
  - type: web
    name: travelrescue-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: travelrescue-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TRAIN_PROVIDER
        value: mock
      - key: BUS_PROVIDER
        value: mock
      - key: FLIGHT_PROVIDER
        value: mock
      - key: TRANSPORT_FALLBACK_TO_MOCK
        value: "true"

databases:
  # Managed PostgreSQL 16/18 Instance
  - name: travelrescue-db
    plan: free
    databaseName: travelrescue_db
    user: travelrescue_user
